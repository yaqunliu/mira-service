version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: video_generator_db
    environment:
      POSTGRES_DB: video_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - video_generator_network
    restart: unless-stopped

  # Redis缓存 (Celery Broker/Backend)
  redis:
    image: redis:7-alpine
    container_name: video_generator_redis
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      # Redis 密码从 .env 文件中的 REDIS_PASSWORD 读取
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      # Redis 数据持久化到命名卷
      - redis_data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - video_generator_network
    restart: unless-stopped
    # Redis 启动命令：启用 AOF 持久化并设置密码
    # 从环境变量 REDIS_PASSWORD 读取密码
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
      else
        echo '警告: Redis 未设置密码，仅适用于开发环境！'
        redis-server --appendonly yes
      fi
      "

  # FastAPI应用
  api:
    build: .
    container_name: video_generator_api
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - TZ=Asia/Shanghai
    depends_on:
      - postgres
      - redis
    volumes:
      # - ./uploads:/app/uploads
      # - ./logs:/app/logs
      - ./:/app
      - /tmp:/tmp
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - video_generator_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100
    restart: unless-stopped
      
  # Celery定时任务调度器 Beat 服务（只启动一个实例）
  celery_beat:
    build: .
    container_name: video_generator_celery_beat
    env_file:
      - .env
    environment:
      # 保持与 API 相同的语言环境配置
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - TZ=Asia/Shanghai
    # Celery Beat 依赖于 Redis (作为 Broker) 和 PostgreSQL (如果任务需要访问数据库)
    depends_on:
      - postgres
      - redis
    volumes:
      # 挂载卷以访问上传文件和日志
      # - ./uploads:/app/uploads
      # - ./logs:/app/logs
      - ./:/app
      - /tmp:/tmp
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - video_generator_network
    # 启动 Celery Beat 的命令（定时任务调度器）
    command: bash start_celery_beat.sh
    restart: unless-stopped

  # Celery任务处理 Worker 服务（可以启动多个实例）
  celery_worker:
    build: .
    container_name: video_generator_celery_worker
    env_file:
      - .env
    environment:
      # 保持与 API 相同的语言环境配置
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - TZ=Asia/Shanghai
    # Celery 依赖于 Redis (作为 Broker) 和 PostgreSQL (如果任务需要访问数据库)
    depends_on:
      - postgres
      - redis
    volumes:
      # 挂载卷以访问上传文件和日志
      # - ./uploads:/app/uploads
      # - ./logs:/app/logs
      - ./:/app
      - /tmp:/tmp
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - video_generator_network
    # 启动 Celery Worker 的命令
    command: bash start_celery.sh
    restart: unless-stopped

volumes:
  postgres_data:
    # PostgreSQL 数据持久化卷
    # 数据存储在 Docker 管理的卷中，即使容器删除数据也不会丢失
  redis_data:
    # Redis 数据持久化卷
    # 数据存储在 Docker 管理的卷中，即使容器删除数据也不会丢失

networks:
  video_generator_network:
    driver: bridge
