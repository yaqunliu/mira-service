version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: video_generator_db
    environment:
      POSTGRES_DB: video_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - video_generator_network

  # Redis缓存 (Celery Broker/Backend)
  redis:
    image: redis:7-alpine
    container_name: video_generator_redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - video_generator_network

  # FastAPI应用
  api:
    build: .
    container_name: video_generator_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - TZ=Asia/Shanghai
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - /tmp:/tmp
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # - ./:/app
    networks:
      - video_generator_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
      
  # Celery任务处理 Worker 服务
  celery_worker:
    build: .
    container_name: video_generator_celery_worker
    env_file:
      - .env
    environment:
      # 保持与 API 相同的语言环境配置
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - TZ=Asia/Shanghai
    # Celery 依赖于 Redis (作为 Broker) 和 PostgreSQL (如果任务需要访问数据库)
    depends_on:
      - postgres
      - redis
    volumes:
      # 挂载卷以访问上传文件和日志
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - /tmp:/tmp
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - video_generator_network
    # 启动 Celery Worker 的命令
    command: bash start_celery.sh

volumes:
  postgres_data:

networks:
  video_generator_network:
    driver: bridge
