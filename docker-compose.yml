version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: video_generator_db
    environment:
      POSTGRES_DB: video_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - video_generator_network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: video_generator_redis
    ports:
      - "6379:6379"
    networks:
      - video_generator_network

  # FastAPI应用
  api:
    build: .
    container_name: video_generator_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - /tmp:/tmp
    networks:
      - video_generator_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:

networks:
  video_generator_network:
    driver: bridge
